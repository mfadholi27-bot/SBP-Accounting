name: SBP V19 validation
on:
  push:
    branches: [v19-html-js-nptrans, main]
    paths:
      - "v19/**"
      - ".github/workflows/v19-check.yml"
  pull_request:
    paths:
      - "v19/**"
      - ".github/workflows/v19-check.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check v19/app.js
      - name: Check required app files
        run: |
          test -s v19/index.html
          test -s v19/styles.css
          test -s v19/app.js
          test -s v19/manifest.webmanifest
          test -s v19/sw.js
