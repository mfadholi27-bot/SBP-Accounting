name: Publish SBP V19 + V19 Development

on:
  push:
    branches: [development]
    paths:
      - "v19-development/**"
      - ".github/workflows/pages-combined.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production source (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: production

      - name: Checkout isolated development source
        uses: actions/checkout@v4
        with:
          ref: development
          path: development

      - name: Validate both applications
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check production/v19/app.js
          node --check development/v19-development/app.js

      - name: Assemble combined Pages site
        run: |
          mkdir -p site
          cp -a production/v19 site/v19
          cp -a development/v19-development site/v19-development
          test -s site/v19/index.html
          test -s site/v19-development/index.html
          test -s site/v19-development/app.js
          test -s site/v19-development/sw.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
